<style>
:root {
  --orange: #E15304;
  --bg-cream: #FAF8F5;
  --text-dark: #2C2B28;
  --text-light: #6B6862;
  --text-muted: #A8A49C;
  --white: #FFFFFF;
  --font-primary: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: var(--bg-cream);
  color: var(--text-dark);
  font-family: var(--font-primary);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

::selection { background: var(--orange); color: var(--white); }

.wordmark {
  position: fixed;
  top: 24px;
  left: 48px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

main {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 0 48px;
  max-width: 1100px;
  margin: 0 auto;
}

.label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 24px;
}

h1 {
  font-family: var(--font-primary);
  font-size: clamp(4rem, 14vw, 11rem);
  font-weight: 200;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--text-dark);
  margin-bottom: 28px;
}

p {
  font-size: 0.95rem;
  font-weight: 300;
  line-height: 1.8;
  color: var(--text-light);
  max-width: 380px;
  margin-bottom: 40px;
}

.home-link {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dark);
  border-bottom: 1px solid var(--text-dark);
  padding-bottom: 4px;
  transition: color 0.25s, border-color 0.25s;
}

.home-link:hover {
  color: var(--orange);
  border-color: var(--orange);
}

@media (max-width: 600px) {
  .wordmark { left: 24px; }
  main { padding: 0 24px; }
}
</style>
<style id="a11y-utils">
/* Accessibility utilities. Added 2026-09-09 in the audit pass.
   .skip-link is invisible until it takes focus, then it is the first tab stop.
   .visually-hidden is read by screen readers and never painted. */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:1000;}
.skip-link:focus{left:16px;top:16px;width:auto;height:auto;overflow:visible;
  padding:12px 22px;background:var(--text-dark,#2C2B28);color:#fff;border-radius:6px;
  font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:12px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
  outline:3px solid var(--orange,#E15304);outline-offset:2px;}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;}
</style>
