<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Emma Moystner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #E15304;
  --bg-cream: #FAF8F5;
  --text-dark: #2C2B28;
  --text-light: #6B6862;
  --text-muted: #A8A49C;
  --white: #FFFFFF;
  --font-primary: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: var(--bg-cream);
  color: var(--text-dark);
  font-family: var(--font-primary);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

::selection { background: var(--orange); color: var(--white); }

.wordmark {
  position: fixed;
  top: 24px;
  left: 48px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

main {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 0 48px;
  max-width: 1100px;
  margin: 0 auto;
}

.label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 24px;
}

h1 {
  font-family: var(--font-primary);
  font-size: clamp(4rem, 14vw, 11rem);
  font-weight: 200;
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 28px;
}

h1 .accent { color: var(--orange); font-weight: 300; }

p {
  font-size: 0.95rem;
  font-weight: 300;
  line-height: 1.8;
  color: var(--text-light);
  max-width: 380px;
  margin-bottom: 40px;
}

.home-link {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--text-dark);
  padding-bottom: 4px;
  transition: color 0.25s, border-color 0.25s;
}

.home-link:hover {
  color: var(--orange);
  border-color: var(--orange);
}

@media (max-width: 600px) {
  .wordmark { left: 24px; }
  main { padding: 0 24px; }
}
</style>
</head>
<body>

<a href="index.html" class="wordmark">Emma Moystner</a>

<main>
  <div class="label">Error 404</div>
  <h1>4<span class="accent">0</span>4</h1>
  <p>This page doesn't exist — or it wandered off. Either way, everything worth seeing is back home.</p>
  <a href="index.html" class="home-link">Back to the work &rarr;</a>
</main>

</body>
</html>
